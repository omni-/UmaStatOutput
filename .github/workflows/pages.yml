name: Sync support data and deploy Pages

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The suite runs on the runner image's Node otherwise, which drifts.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Test calculator math and views
        run: npm test

      - name: Test data sync parser
        run: npm run test:python

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Card art and portraits rarely change, and the sync skips any file that
      # is already there, so a restored cache keeps the daily run from
      # re-downloading every image. The key rotates weekly: inside a week the
      # key hits and nothing is written back, so a ~80 MB cache is saved once a
      # week rather than on every push.
      - name: Card art cache key
        id: art-cache-key
        run: echo "week=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore card art
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _site/img
          key: card-art-${{ steps.art-cache-key.outputs.week }}
          restore-keys: card-art-

      - name: Build static site and sync Global support data
        run: |
          mkdir -p _site
          cp index.html *.mjs *.css _site/
          python3 scripts/sync_cards.py --output _site/data/cards.json --images _site/img

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
